name: 제주 부동산 전체 백필 (수동)

on:
  workflow_dispatch:
    inputs:
      months:
        description: '백필 개월 수'
        required: true
        default: '12'
        type: choice
        options:
          - '6'
          - '12'
          - '24'
          - '36'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Full backfill via fetch_all / incremental
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
        run: |
          MONTHS="${{ github.event.inputs.months }}"
          echo "Backfill months=$MONTHS"
          # 증분 스크립트에 months 전달 (전체 재수집에 동일 로직 사용)
          python scripts/fetch_incremental.py --months "$MONTHS"
