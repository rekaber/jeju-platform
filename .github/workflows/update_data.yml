name: 제주 부동산 데이터 자동 업데이트

on:
  schedule:
    - cron: '0 2 * * *'   # 매일 KST 11:00 (UTC 02:00)
  workflow_dispatch:        # 수동 실행 가능
    inputs:
      months:
        description: '수집 개월 수 (증분)'
        required: false
        default: '3'
        type: choice
        options:
          - '1'
          - '3'
          - '6'
          - '12'

concurrency:
  group: jeju-data-update
  cancel-in-progress: false

permissions:
  contents: read
  issues: write
  actions: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 시크릿 존재 확인
        run: |
          missing=0
          for name in MOLIT_API_KEY SUPABASE_URL SUPABASE_SERVICE_KEY KAKAO_REST_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name 이 비어 있습니다."
              missing=1
            else
              echo "OK $name"
            fi
          done
          exit $missing
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}

      - name: 실거래 증분 수집 (--force, 월 격리)
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          MONTHS="${{ github.event.inputs.months }}"
          if [ -z "$MONTHS" ]; then MONTHS=3; fi
          python scripts/fetch_incremental.py --months "$MONTHS" --force

      - name: 건축인허가 기간 upsert
        continue-on-error: true
        env:
          MOLIT_API_KEY: ${{ secrets.MOLIT_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          KAKAO_REST_KEY: ${{ secrets.KAKAO_REST_KEY }}
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/fetch_arch.py --days 120

      - name: 건수 검증
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          VERIFY_MONTHS: ${{ github.event.inputs.months || '3' }}
          PYTHONUNBUFFERED: '1'
        run: |
          python scripts/verify_daily_counts.py

      - name: 실패 시 GitHub Issue 알림
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="[자동] 일일 데이터 업데이트 실패 — run ${{ github.run_id }}"
          BODY=$(cat <<EOF
          ## 일일 데이터 업데이트 실패

          - **워크플로:** ${{ github.workflow }}
          - **실행:** ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          - **브랜치:** ${{ github.ref_name }}
          - **시각(UTC):** $(date -u +"%Y-%m-%d %H:%M:%S")

          Actions 로그를 확인한 뒤 필요하면 수동 \`workflow_dispatch\`로 재실행하세요.
          EOF
          )
          # 동일 run 중복 이슈 방지: 최근 열린 동일 제목 검색
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "run ${{ github.run_id }} in:title" --json number --jq '.[0].number' || true)
          if [ -n "$EXISTING" ]; then
            echo "이미 이슈 #$EXISTING 존재"
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "재알림: job 실패 지속. ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi
